<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Marea Alta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layouts.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/motion.css">
</head>
<body style="background: url('https://images.unsplash.com/photo-1559339352-11d035aa65de?q=80&w=1400&auto=format&fit=crop') center/cover fixed;">
    <div style="position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: -1;"></div>

    <header class="header">
        <a href="index.html" class="nav__logo" style="color: #fff;">MAREA ALTA.</a>
        <nav>
            <ul class="nav__list">
                <li><a href="menu.html" class="nav__link" style="color: #fff;">La Carta</a></li>
                <li><a href="origen.html" class="nav__link" style="color: #fff;">El Origen</a></li>
                <li><a href="reservas.html" class="nav__link" style="color: var(--clr-accent);">Reservas</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding-top: var(--space-xl); min-height: 100vh; display: flex; align-items: center;">
        <section class="container wave-reveal" style="max-width: 600px;">
            <div style="background: var(--clr-bg); padding: var(--space-m); border-radius: 2px; text-align: center;">
                <h1 style="font-size: var(--text-h2); color: var(--clr-surface); margin-bottom: var(--space-s);">Asegura tu Mesa</h1>
                <p style="color: var(--clr-text); margin-bottom: var(--space-m);">Abrimos reservas con 30 días de antelación. Dada la naturaleza de nuestro menú (dependiente de la pesca diaria), no podemos garantizar platos específicos por adelantado.</p>
                
                <form action="#">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                        <input type="date" required style="padding: 1rem; border: 1px solid var(--clr-surface-light); background: #fff; font-family: var(--font-body); outline: none;">
                        <select required style="padding: 1rem; border: 1px solid var(--clr-surface-light); background: #fff; font-family: var(--font-body); outline: none;">
                            <option value="" disabled selected>Personas</option>
                            <option value="1">1 Persona</option>
                            <option value="2">2 Personas</option>
                            <option value="3">3 Personas</option>
                            <option value="4">4 Personas</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-coral" style="width: 100%;">Buscar Disponibilidad</button>
                </form>
            </div>
        </section>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
